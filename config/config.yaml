timing:
  ready_blank_duration: 1.1
  fixation_duration: 0.5
  inter_display_duration: 0.1
  response_timeout: 5.0

stimuli:
  instruction_general:
    type: text
    font: SimHei
    text: |
      负启动任务

      每个画面左侧有一个绿色目标轮廓，可能叠加一个需要忽略的红色轮廓；右侧是白色参照轮廓。
      若绿色轮廓与白色轮廓相同，请按 J；不同请按 F。
      请尽快且准确作答。每对画面开始前由你按空格键准备。

      按空格键开始练习。
    color: white
    height: 0.62
    wrapWidth: 23
    pos: [0, 0]
  ready_prompt: {type: text, font: SimHei, text: "准备好了吗？\n\n按空格键开始", color: "#60A5FA", height: 0.72, wrapWidth: 18, pos: [0, 0]}
  block_start: {type: text, font: SimHei, text: "第 {block_number} / {total_blocks} 组\n\n按空格键开始", color: white, height: 0.72, wrapWidth: 18, pos: [0, 0]}
  block_break: {type: text, font: SimHei, text: "第 {block_number} 组完成\n\n本组正确率：{accuracy:.1%}\n\n请休息，准备好后按空格键继续。", color: white, height: 0.68, wrapWidth: 21, pos: [0, 0]}
  good_bye: {type: text, font: SimHei, text: "任务完成\n\n总体正确率：{accuracy:.1%}\n负启动效应：{negative_priming_text}\n\n按空格键退出。", color: white, height: 0.68, wrapWidth: 21, pos: [0, 0]}
  fixation: {type: text, font: SimHei, text: "+", color: white, height: 0.72, pos: [0, 0]}
  blank_screen: {type: rect, width: 30, height: 20, fillColor: black, lineColor: black, pos: [0, 0]}

triggers:
  map:
    experiment_start: 1
    block_start: 2
    block_end: 3
    ready: 10
    pre_pair_blank: 11
    prime_fixation: 20
    prime_no_distractor: 30
    prime_control: 31
    prime_negative_priming: 32
    response_different: 33
    response_same: 34
    prime_timeout: 35
    inter_display_blank: 40
    probe_fixation: 50
    probe_no_distractor: 60
    probe_control: 61
    probe_negative_priming: 62
    probe_response_different: 63
    probe_response_same: 64
    probe_timeout: 65
    experiment_end: 99
  driver: {type: mock, print_codes: true}
  policy: {strict: false}
  timing: {post_delay_s: 0.001}
