subinfo_fields:
  - name: subject_id
    type: int
    constraints: {min: 101, max: 999, digits: 3}
subinfo_mapping:
  subject_id: 被试编号
  Participant Information: 被试信息
  registration_failed: 登记失败
  registration_successful: 登记成功
  invalid_input: "{field} 的值无效"

window:
  size: [1280, 800]
  units: deg
  screen: 0
  bg_color: black
  fullscreen: false
  monitor_width_cm: 35.5
  monitor_distance_cm: 57

